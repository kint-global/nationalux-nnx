<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="NNX Whitepaper 2.0 — Nationalux AI & Data Economy.">
<title>NNX Whitepaper 2.0 | Nationalux</title>
<style>
:root{--navy:#081a35;--blue:#1677ff;--ink:#17243b;--line:#dce7f5;--muted:#64748b}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;background:#0b1729;color:#fff}
.bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));background:rgba(8,26,53,.96);backdrop-filter:blur(12px);border-bottom:1px solid #24405f}
.brand{font-weight:900;font-size:18px;letter-spacing:-.5px;color:#fff;text-decoration:none}.brand span{color:#59c7ff}
.title{flex:1;min-width:0;text-align:center;font-size:13px;font-weight:700;color:#c9d8eb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:8px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:9px 12px;border-radius:8px;font-size:13px;font-weight:800;text-decoration:none;white-space:nowrap}
.btn-back{border:1px solid #5679a2;color:#fff}.btn-open{background:#fff;color:var(--navy)}
.viewer{height:calc(100dvh - 56px);width:100%;background:#111}
.viewer iframe,.viewer embed,.viewer object{width:100%;height:100%;border:0;display:block;background:#525659}
.fallback{display:none;height:100%;padding:32px 20px;text-align:center;align-content:center}
.fallback h1{font-size:22px;margin:0 0 10px}.fallback p{color:#9fb3cc;margin:0 0 22px;line-height:1.5}
.fallback .btn{margin:4px}
@media(max-width:640px){
  .title{display:none}
  .btn{padding:10px 12px;font-size:12px}
  .fallback{display:grid}
  .viewer iframe,.viewer embed,.viewer object{display:none}
}
@media(min-width:641px){.fallback{display:none!important}.viewer iframe{display:block}}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="/">N<span>N</span>X</a>
  <div class="title">Whitepaper 2.0 · Public Edition</div>
  <div class="actions">
    <a class="btn btn-back" href="/">Back</a>
    <a class="btn btn-open" id="openPdf" href="#" target="_blank" rel="noopener">Open / Download</a>
  </div>
</header>
<main class="viewer">
  <iframe id="pdfFrame" title="NNX Whitepaper PDF" allow="fullscreen"></iframe>
  <div class="fallback">
    <h1>NNX Whitepaper 2.0</h1>
    <p>Open the whitepaper in your device’s PDF reader for the best reading experience.</p>
    <a class="btn btn-open" id="openPdfMobile" href="#" target="_blank" rel="noopener">Open Whitepaper</a>
    <a class="btn btn-back" href="/">Back to site</a>
  </div>
</main>
<script>
(function(){
  var PDF_URL = "https://firebasestorage.googleapis.com/v0/b/nationalux-nnx.firebasestorage.app/o/whitepaper%2FNNX_Whitepaper_2.0_Public_Final.pdf?alt=media";
  var frame = document.getElementById("pdfFrame");
  var openA = document.getElementById("openPdf");
  var openM = document.getElementById("openPdfMobile");
  openA.href = PDF_URL;
  openM.href = PDF_URL;
  // Chrome/Edge: hide chrome toolbar for a cleaner reading view when supported
  frame.src = PDF_URL + "#view=FitH&toolbar=1&navpanes=0";
})();
</script>
</body>
</html>
